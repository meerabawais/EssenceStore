# Production reverse-proxy config for EssenceStore.
#
# In production, Nginx replaces the Node "gateway" used in development
# (gateway/server.js) — it proxies directly to the two Next.js apps running
# under PM2. This avoids an unnecessary extra hop through Node.
#
# Install at /etc/nginx/sites-available/essencestore.conf and symlink into
# /etc/nginx/sites-enabled/, then `nginx -t && systemctl reload nginx`.

upstream essencestore_admin {
    server 127.0.0.1:3003;
    keepalive 64;
}

upstream essencestore_store {
    server 127.0.0.1:3002;
    keepalive 64;
}

# Map used to correctly close/keep the Connection header open only for
# WebSocket upgrade requests (Next.js Fast Refresh / HMR does not run in
# production, but this also covers any app-level websocket usage).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # HTTP-only for now: no domain/SSL cert set up yet. Once you have a
    # domain and run certbot, restore the 301-to-HTTPS block + a 443 server
    # block using the cert paths certbot creates.
    client_max_body_size 25m; # allow large uploads (e.g. product images)

    # ---- Admin: everything under /admin ----------------------------------
    # essence-admin has `basePath: "/admin"` set in next.config.mjs, so it
    # expects to receive the "/admin" prefix as-is — do NOT rewrite it away.
    location /admin {
        proxy_pass http://essencestore_admin;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support (Next.js dev HMR; harmless to keep in prod)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- Store: everything else -------------------------------------------
    location / {
        proxy_pass http://essencestore_store;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
